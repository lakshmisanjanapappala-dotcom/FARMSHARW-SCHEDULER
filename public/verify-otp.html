<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Phone OTP — FarmSharw Scheduler</title>
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <header id="site-header"></header>

  <main style="padding: var(--space-12) 0 var(--space-16); display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: var(--space-8); box-shadow: var(--shadow-lg); text-align: center;">
        <span style="font-size: 2.5rem;">📱</span>
        <h2 style="font-size: 1.5rem; margin-top: 8px;">Verify Mobile Number</h2>
        <p style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">
          We sent a 6-digit OTP code to <strong id="display-phone">+91 XXXXXXXXXX</strong>.
        </p>

        <form id="verify-form" style="margin-top: 24px; text-align: left;">
          <div class="form-group">
            <label for="otp-code">6-Digit Code</label>
            <input type="text" id="otp-code" maxlength="6" pattern="\d{6}" placeholder="123456" style="text-align:center; font-size:1.5rem; letter-spacing:6px;" required>
            <span class="form-hint" style="text-align:center; display:block; margin-top:8px;">Sandbox test code: <strong>123456</strong></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 16px;">
            Verify & Continue
          </button>
        </form>

        <p style="font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: 24px; margin-bottom: 0;">
          Didn't receive the code? <a href="/login.html">Resend OTP</a>
        </p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { renderHeader } from '/assets/js/components/nav.js';
    import { renderFooter } from '/assets/js/components/footer.js';
    import { Api } from '/assets/js/api.js';
    import { Auth } from '/assets/js/auth.js';
    import { Toast } from '/assets/js/components/toast.js';

    renderHeader();
    renderFooter();

    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || '+919876543210';
    document.getElementById('display-phone').textContent = phone;

    document.getElementById('verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('otp-code').value.trim();

      try {
        const res = await Api.post('/auth/phone/verify', { phone, token });
        const session = res.data.session;
        Auth.setSession(session.access_token, session.user);
        Toast.success('Phone verified successfully!');
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 800);
      } catch (err) {
        Toast.error(err.message);
      }
    });
  </script>
</body>
</html>
