<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — FarmSharw Scheduler</title>
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body>
  <header id="site-header"></header>

  <main style="padding: var(--space-12) 0 var(--space-16); display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: var(--space-8); box-shadow: var(--shadow-lg); text-align: center;">
        <span style="font-size: 2.5rem;">🔑</span>
        <h2 style="font-size: 1.5rem; margin-top: 8px;">Reset Password</h2>
        <p style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">
          Enter your registered email address to receive password reset instructions.
        </p>

        <form id="forgot-form" style="margin-top: 24px; text-align: left;">
          <div class="form-group">
            <label for="reset-email">Email Address</label>
            <input type="email" id="reset-email" placeholder="farmer@example.com" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 16px;">
            Send Reset Instructions
          </button>
        </form>

        <p style="font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: 24px; margin-bottom: 0;">
          Remembered password? <a href="/login.html">Back to Login</a>
        </p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module">
    import { renderHeader } from '/assets/js/components/nav.js';
    import { renderFooter } from '/assets/js/components/footer.js';
    import { Toast } from '/assets/js/components/toast.js';

    renderHeader();
    renderFooter();

    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      Toast.success('Password recovery instructions dispatched if email exists in database.');
    });
  </script>
</body>
</html>
