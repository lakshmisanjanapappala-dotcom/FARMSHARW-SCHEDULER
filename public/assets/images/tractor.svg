<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#e8f0ec"/>
  <!-- Field ground -->
  <path d="M0 200 L400 200 L400 250 L0 250 Z" fill="#8d7256"/>
  <path d="M0 190 L400 190 L400 205 L0 205 Z" fill="#5c8a4d"/>
  <!-- Tractor Body -->
  <rect x="180" y="90" width="110" height="70" rx="6" fill="#1b4d3e"/>
  <path d="M110 120 L180 120 L180 160 L110 160 Z" fill="#286e58"/>
  <!-- Cabin -->
  <path d="M190 50 L270 50 L280 90 L180 90 Z" fill="#ffffff" stroke="#1b4d3e" stroke-width="4"/>
  <rect x="200" y="58" width="60" height="26" rx="2" fill="#d1e3dd"/>
  <!-- Exhaust Pipe -->
  <rect x="130" y="70" width="8" height="50" fill="#333"/>
  <path d="M130 70 L140 60 L145 65 L138 72 Z" fill="#333"/>
  <!-- Engine Grille & Headlight -->
  <rect x="110" y="125" width="8" height="30" fill="#ffc107"/>
  <circle cx="115" cy="130" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <!-- Wheels -->
  <!-- Big Rear Wheel -->
  <circle cx="250" cy="170" r="42" fill="#2b2d2f"/>
  <circle cx="250" cy="170" r="24" fill="#c28833"/>
  <circle cx="250" cy="170" r="8" fill="#555"/>
  <!-- Small Front Wheel -->
  <circle cx="140" cy="180" r="26" fill="#2b2d2f"/>
  <circle cx="140" cy="180" r="14" fill="#c28833"/>
  <circle cx="140" cy="180" r="5" fill="#555"/>
  <!-- Label -->
  <text x="200" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Heavy Utility Tractor (45-55 HP)</text>
</svg>
