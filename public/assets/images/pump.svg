<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#eef7f9"/>
  <rect x="0" y="200" width="400" height="50" fill="#655b51"/>
  <!-- Pump Cart Chassis -->
  <rect x="120" y="120" width="160" height="40" rx="4" fill="#00838f"/>
  <!-- Engine Block -->
  <rect x="140" y="65" width="60" height="55" rx="3" fill="#2b2d2f"/>
  <!-- Centrifugal Volute Casing -->
  <circle cx="240" cy="95" r="32" fill="#006064"/>
  <circle cx="240" cy="95" r="16" fill="#4dd0e1"/>
  <!-- Delivery pipe & valve -->
  <rect x="232" y="30" width="16" height="35" fill="#888"/>
  <rect x="220" y="25" width="40" height="8" fill="#333"/>
  <!-- Cart Wheels -->
  <circle cx="150" cy="175" r="22" fill="#333"/>
  <circle cx="150" cy="175" r="10" fill="#c28833"/>
  <circle cx="250" cy="175" r="22" fill="#333"/>
  <circle cx="250" cy="175" r="10" fill="#c28833"/>
  <text x="200" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Diesel Centrifugal Irrigation Pump</text>
</svg>
